<!-- ==================== MODAL 2: ADD VEHICLE (ENHANCED) ==================== -->
<div id="addVehicleModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121829] rounded-3xl max-w-lg w-full shadow-2xl shadow-black/80 overflow-hidden">

        <!-- Modal Header -->
        <div class="px-7 pt-6 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#8CC63F]/15 text-[#8CC63F] flex items-center justify-center">
                    <i data-lucide="car" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-white tracking-tight">Register Commercial Vehicle</h3>
                    <p class="text-[10px] text-slate-400 mt-0.5">Add a new vehicle to your fleet inventory</p>
                </div>
            </div>
            <button onclick="closeModal('addVehicleModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Form Content with Sections -->
        <form method="POST" action="{% url 'portal_provider_workspace' %}" class="px-7 pb-7 space-y-5" id="addVehicleForm">
            {% csrf_token %}
            <input type="hidden" name="action" value="add_vehicle">

            <!-- Section 1: Identity -->
            <div class="space-y-3.5">
                <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <span class="w-5 h-5 rounded-md bg-white/5 flex items-center justify-center text-[#8CC63F] text-[9px] font-black">1</span>
                    Vehicle Identity
                </div>

                <!-- Plate Number — prominent field -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Registration Plate <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <i data-lucide="hash" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" name="registration_number" placeholder="e.g. GS 4821-24" required
                            class="w-full pl-10 pr-4 py-3 bg-[#0A0F1D] rounded-xl text-white font-mono font-black text-sm uppercase tracking-wider placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                    </div>
                </div>

                <!-- Make + Model -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Make <span class="text-red-400">*</span></label>
                        <input type="text" name="make" placeholder="e.g. Toyota" required list="vehicleMakesList"
                            class="w-full px-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                        <datalist id="vehicleMakesList">
                            <option value="Toyota">
                            <option value="Mercedes-Benz">
                            <option value="BMW">
                            <option value="Hyundai">
                            <option value="Kia">
                            <option value="Nissan">
                            <option value="Honda">
                            <option value="Ford">
                            <option value="Volkswagen">
                            <option value="Land Rover">
                            <option value="Lexus">
                            <option value="Audi">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Model <span class="text-red-400">*</span></label>
                        <input type="text" name="model" placeholder="e.g. Prado TX" required
                            class="w-full px-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                    </div>
                </div>

                <!-- Year + Color + Category -->
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Year</label>
                        <input type="number" name="year" value="2024" min="2000" max="2030"
                            class="w-full px-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs font-mono focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Color</label>
                        <input type="text" name="color" placeholder="e.g. Black"
                            class="w-full px-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                            <span>Broker Fleet Category <span class="text-red-400">*</span></span>
                            <span class="text-[9px] text-[#8CC63F] font-semibold">Rate Card</span>
                        </label>
                        <select name="category" id="addVehicleCategorySelect" onchange="updateAddCategoryPreview()"
                            class="w-full px-3 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all appearance-none cursor-pointer">
                            {% if category_rates %}
                                {% for cr in category_rates %}
                                <option value="{{ cr.category }}" 
                                        data-base="{{ cr.base_wholesale_rate|floatformat:0 }}" 
                                        data-km="{{ cr.per_km_rate|floatformat:2 }}" 
                                        data-charter="{{ cr.daily_charter_rate|floatformat:0 }}" 
                                        data-seating="{{ cr.min_seating_capacity }}"
                                        data-models="{{ cr.recommended_models|escapejs }}">
                                    {{ cr.display_name }} (Base: GHS {{ cr.base_wholesale_rate|floatformat:0 }})
                                </option>
                                {% endfor %}
                            {% else %}
                                <option value="SUV" data-base="450" data-km="12.00" data-charter="1200" data-seating="5">SUV / 4x4 (Base: GHS 450)</option>
                                <option value="EXECUTIVE" data-base="380" data-km="10.00" data-charter="1000" data-seating="4">Executive Saloon (Base: GHS 380)</option>
                                <option value="SEDAN" data-base="280" data-km="8.00" data-charter="800" data-seating="4">Standard Sedan (Base: GHS 280)</option>
                                <option value="VAN" data-base="550" data-km="15.00" data-charter="1500" data-seating="8">Passenger Van (Base: GHS 550)</option>
                                <option value="MINIBUS" data-base="750" data-km="18.00" data-charter="2000" data-seating="15">Minibus / Shuttle (Base: GHS 750)</option>
                                <option value="COASTER_BUS" data-base="1200" data-km="25.00" data-charter="3200" data-seating="30">Coaster Bus (Base: GHS 1,200)</option>
                                <option value="LUXURY" data-base="900" data-km="20.00" data-charter="2500" data-seating="4">VIP / Luxury (Base: GHS 900)</option>
                            {% endif %}
                        </select>
                    </div>
                </div>

                <!-- Broker Category Wholesale Guideline Strip -->
                <div id="addCategoryRatePreview" class="p-3 rounded-xl bg-white/[0.03] border border-[#8CC63F]/20 space-y-1.5 text-xs">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-extrabold uppercase text-[#8CC63F] flex items-center gap-1.5">
                            <i data-lucide="calculator" class="w-3.5 h-3.5"></i> Broker Wholesale Schedule
                        </span>
                        <span id="addRateBase" class="font-mono font-bold text-white">Base: GHS 450</span>
                    </div>
                    <div class="flex flex-wrap items-center justify-between text-[11px] text-slate-400 gap-2 pt-1 border-t border-white/5">
                        <span id="addRateKm">Per KM: GHS 12.00/km</span>
                        <span id="addRateCharter">Day Charter: GHS 1,200</span>
                        <span id="addRateSeating">Min Seating: 5 pax</span>
                    </div>
                </div>
            </div>

            <!-- Section 2: Capacity & Amenities -->
            <div class="space-y-3.5">
                <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <span class="w-5 h-5 rounded-md bg-white/5 flex items-center justify-center text-[#8CC63F] text-[9px] font-black">2</span>
                    Capacity & Equipment
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Seating Capacity</label>
                        <div class="relative">
                            <i data-lucide="users" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="number" name="seating_capacity" value="5" min="1" max="60"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs font-mono focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Luggage Capacity</label>
                        <div class="relative">
                            <i data-lucide="briefcase" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="text" name="luggage_capacity" placeholder="e.g. 3 large bags"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-[#8CC63F]/30 transition-all">
                        </div>
                    </div>
                </div>

                <!-- Amenities as toggle chips -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Onboard Amenities & Features</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="amenity-chip flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-[#0A0F1D] cursor-pointer transition-all hover:bg-white/[0.06] group has-[:checked]:bg-[#8CC63F]/10 has-[:checked]:ring-1 has-[:checked]:ring-[#8CC63F]/30">
                            <input type="checkbox" name="wifi_available" checked class="sr-only peer">
                            <div class="w-7 h-7 rounded-lg bg-white/5 peer-checked:bg-[#8CC63F]/20 flex items-center justify-center transition-all shrink-0">
                                <i data-lucide="wifi" class="w-3.5 h-3.5 text-slate-500 peer-checked:text-[#8CC63F] group-has-[:checked]:text-[#8CC63F]"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-white leading-tight">WiFi Hotspot</p>
                                <p class="text-[9px] text-slate-500">In-vehicle internet</p>
                            </div>
                        </label>

                        <label class="amenity-chip flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-[#0A0F1D] cursor-pointer transition-all hover:bg-white/[0.06] group has-[:checked]:bg-blue-500/10 has-[:checked]:ring-1 has-[:checked]:ring-blue-500/30">
                            <input type="checkbox" name="water_provided" checked class="sr-only peer">
                            <div class="w-7 h-7 rounded-lg bg-white/5 peer-checked:bg-blue-500/20 flex items-center justify-center transition-all shrink-0">
                                <i data-lucide="droplet" class="w-3.5 h-3.5 text-slate-500 group-has-[:checked]:text-blue-400"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-white leading-tight">Bottled Water</p>
                                <p class="text-[9px] text-slate-500">Complimentary refreshment</p>
                            </div>
                        </label>

                        <label class="amenity-chip flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-[#0A0F1D] cursor-pointer transition-all hover:bg-white/[0.06] group has-[:checked]:bg-purple-500/10 has-[:checked]:ring-1 has-[:checked]:ring-purple-500/30">
                            <input type="checkbox" name="has_accessibility" class="sr-only peer">
                            <div class="w-7 h-7 rounded-lg bg-white/5 peer-checked:bg-purple-500/20 flex items-center justify-center transition-all shrink-0">
                                <i data-lucide="accessibility" class="w-3.5 h-3.5 text-slate-500 group-has-[:checked]:text-purple-400"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-white leading-tight">Wheelchair Access</p>
                                <p class="text-[9px] text-slate-500">ADA-compliant ramp</p>
                            </div>
                        </label>

                        <label class="amenity-chip flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-[#0A0F1D] cursor-pointer transition-all hover:bg-white/[0.06] group has-[:checked]:bg-amber-500/10 has-[:checked]:ring-1 has-[:checked]:ring-amber-500/30">
                            <input type="checkbox" name="has_child_seat" class="sr-only peer">
                            <div class="w-7 h-7 rounded-lg bg-white/5 peer-checked:bg-amber-500/20 flex items-center justify-center transition-all shrink-0">
                                <i data-lucide="baby" class="w-3.5 h-3.5 text-slate-500 group-has-[:checked]:text-amber-400"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-white leading-tight">Child Safety Seat</p>
                                <p class="text-[9px] text-slate-500">ISOFIX-compatible</p>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="flex items-center justify-between pt-2">
                <p class="text-[10px] text-slate-500 flex items-center gap-1">
                    <i data-lucide="info" class="w-3 h-3"></i>
                    DVLA roadworthiness required post-registration
                </p>
                <div class="flex items-center gap-2.5">
                    <button type="button" onclick="closeModal('addVehicleModal')" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-bold transition-all">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 bg-[#8CC63F] hover:bg-[#73A233] text-[#0A0F1D] rounded-xl text-xs font-black shadow-lg shadow-[#8CC63F]/25 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
                        Register Vehicle
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function updateAddCategoryPreview() {
        const sel = document.getElementById('addVehicleCategorySelect');
        if (!sel) return;
        const opt = sel.options[sel.selectedIndex];
        if (!opt) return;
        const base = opt.dataset.base || '450';
        const km = opt.dataset.km || '12.00';
        const charter = opt.dataset.charter || '1,200';
        const seating = opt.dataset.seating || '5';

        const baseEl = document.getElementById('addRateBase');
        const kmEl = document.getElementById('addRateKm');
        const charterEl = document.getElementById('addRateCharter');
        const seatingEl = document.getElementById('addRateSeating');

        if (baseEl) baseEl.textContent = `Base: GHS ${base}`;
        if (kmEl) kmEl.textContent = `Per KM: GHS ${km}/km`;
        if (charterEl) charterEl.textContent = `Day Charter: GHS ${charter}`;
        if (seatingEl) seatingEl.textContent = `Min Seating: ${seating} pax`;
    }
    document.addEventListener('DOMContentLoaded', updateAddCategoryPreview);
</script>
