<!-- ==================== MODAL 3: ADD DRIVER (ENHANCED) ==================== -->
<div id="addDriverModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121829] rounded-3xl max-w-lg w-full shadow-2xl shadow-black/80 overflow-hidden">
        <!-- Modal Header -->
        <div class="px-7 pt-6 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-500/15 text-purple-400 flex items-center justify-center">
                    <i data-lucide="user-plus" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-white tracking-tight">Enroll Professional Chauffeur</h3>
                    <p class="text-[10px] text-slate-400 mt-0.5">Register a vetted commercial driver to your roster</p>
                </div>
            </div>
            <button onclick="closeModal('addDriverModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form method="POST" action="{% url 'portal_provider_workspace' %}" class="px-7 pb-7 space-y-5">
            {% csrf_token %}
            <input type="hidden" name="action" value="add_driver">

            <!-- Section 1: Personal Details -->
            <div class="space-y-3.5">
                <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <span class="w-5 h-5 rounded-md bg-white/5 flex items-center justify-center text-purple-400 text-[9px] font-black">1</span>
                    Chauffeur Identity & Contact
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Full Name <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" name="full_name" placeholder="e.g. Kofi Mensah" required
                            class="w-full pl-10 pr-4 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500/30 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Phone Number <span class="text-red-400">*</span></label>
                        <div class="relative">
                            <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="text" name="phone_number" placeholder="+233 24 000 1111" required
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs font-mono placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500/30 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Languages Spoken</label>
                        <div class="relative">
                            <i data-lucide="languages" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="text" name="languages_spoken" value="English, Twi, Ga"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500/30 transition-all">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section 2: Licensing -->
            <div class="space-y-3.5">
                <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <span class="w-5 h-5 rounded-md bg-white/5 flex items-center justify-center text-purple-400 text-[9px] font-black">2</span>
                    Driver Certification & Permit
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Permit Number <span class="text-red-400">*</span></label>
                        <div class="relative">
                            <i data-lucide="award" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="text" name="license_number" placeholder="DL-99231-GH" required
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white font-mono uppercase text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500/30 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Permit Expiry Date</label>
                        <div class="relative">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input type="date" name="license_expiry"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs focus:outline-none focus:ring-2 focus:ring-purple-500/30 transition-all">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="flex items-center justify-between pt-2">
                <p class="text-[10px] text-slate-500 flex items-center gap-1">
                    <i data-lucide="shield-check" class="w-3 h-3 text-emerald-400"></i>
                    Requires commercial chauffeur endorsement
                </p>
                <div class="flex items-center gap-2.5">
                    <button type="button" onclick="closeModal('addDriverModal')" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-bold transition-all">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-black shadow-lg shadow-purple-600/25 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
                        Enroll Driver
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
