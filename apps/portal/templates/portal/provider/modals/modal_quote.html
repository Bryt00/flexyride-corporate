<!-- ==================== MODAL 1: SUBMIT WHOLESALE QUOTE (ENHANCED) ==================== -->
<div id="quoteModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121829] rounded-3xl max-w-lg w-full shadow-2xl shadow-black/80 overflow-hidden">
        <!-- Modal Header -->
        <div class="px-7 pt-6 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-white tracking-tight">Submit Wholesale Quote</h3>
                    <p id="modalRfqSub" class="text-[10px] text-slate-400 mt-0.5">RFQ Reference</p>
                </div>
            </div>
            <button onclick="closeModal('quoteModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form method="POST" action="{% url 'portal_provider_workspace' %}" class="px-7 pb-7 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="action" value="submit_quote">
            <input type="hidden" id="modalQuoteReqId" name="quote_request_id" value="">

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Your Offered Wholesale Cost <span class="text-red-400">*</span></label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-xs font-black text-slate-500">GHS</span>
                    <input type="number" id="modalOfferedCost" name="offered_cost" step="5" min="1" placeholder="450" required
                        class="w-full pl-14 pr-4 py-3 bg-[#0A0F1D] rounded-xl text-white font-mono font-black text-base placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all">
                </div>
                <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3 text-slate-500"></i>
                    Confidential rate between your fleet company and FlexyRide Corporate.
                </p>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Proposed Fleet Vehicle <span class="text-red-400">*</span></label>
                <div class="relative">
                    <i data-lucide="car" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <select name="proposed_vehicle_id" id="modalVehicleSelect" required
                        class="w-full pl-10 pr-4 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all appearance-none cursor-pointer">
                        <option value="">-- Select Available Vehicle --</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}">{{ v.registration_number }} - {{ v.make }} {{ v.model }} ({{ v.get_category_display }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Wholesale Notes / Inclusions</label>
                <textarea id="modalNotes" name="notes" rows="3" placeholder="e.g. Executive chauffeur assigned, bottled water included, WiFi onboard."
                    class="w-full px-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all resize-none"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2.5 pt-2">
                <button type="button" onclick="closeModal('quoteModal')" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-bold transition-all">Cancel</button>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/25 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-1.5">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    Send Wholesale Quote
                </button>
            </div>
        </form>
    </div>
</div>
