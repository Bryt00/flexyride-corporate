<!-- ==================== MODAL 4: UPLOAD DOCUMENT (ENHANCED) ==================== -->
<div id="uploadDocModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121829] rounded-3xl max-w-lg w-full shadow-2xl shadow-black/80 overflow-hidden">
        <!-- Modal Header -->
        <div class="px-7 pt-6 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-white tracking-tight">Submit Compliance Certificate</h3>
                    <p class="text-[10px] text-slate-400 mt-0.5">Register DVLA, insurance, or operational compliance document</p>
                </div>
            </div>
            <button onclick="closeModal('uploadDocModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form method="POST" action="{% url 'portal_provider_workspace' %}" class="px-7 pb-7 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="action" value="upload_compliance">

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Document Type <span class="text-red-400">*</span></label>
                <div class="relative">
                    <i data-lucide="file-badge" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <select name="document_type"
                        class="w-full pl-10 pr-4 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all appearance-none cursor-pointer">
                        <option value="BUSINESS_LICENSE">Business License / DVLA Commercial Permit</option>
                        <option value="INSURANCE">Commercial Passenger Insurance Policy</option>
                        <option value="ROADWORTHINESS">DVLA Roadworthiness Inspection</option>
                        <option value="TAX_CERTIFICATE">GRA Tax Compliance Certificate</option>
                        <option value="OTHER">Other Operational Document</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Document / Policy Number <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <i data-lucide="hash" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" name="document_number" placeholder="DVLA-2026-GH" required
                            class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white font-mono uppercase text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Certificate Expiry Date</label>
                    <div class="relative">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="date" name="expiry_date"
                            class="w-full pl-9 pr-3.5 py-2.5 bg-[#0A0F1D] rounded-xl text-white text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all">
                    </div>
                </div>
            </div>

            <!-- Verification Notice -->
            <div class="p-3.5 rounded-xl bg-emerald-500/10 flex items-start gap-2.5">
                <i data-lucide="info" class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5"></i>
                <p class="text-[10px] text-slate-300 leading-relaxed">
                    Submitted certifications undergo automatic compliance validation and FlexyRide Corporate audit prior to assignment clearance.
                </p>
            </div>

            <!-- Action Bar -->
            <div class="flex items-center justify-end gap-2.5 pt-2">
                <button type="button" onclick="closeModal('uploadDocModal')" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-bold transition-all">Cancel</button>
                <button type="submit" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-[#0A0F1D] rounded-xl text-xs font-black shadow-lg shadow-emerald-500/25 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-1.5">
                    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
                    Register Document
                </button>
            </div>
        </form>
    </div>
</div>
