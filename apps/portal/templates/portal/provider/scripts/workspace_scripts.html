<script>
    // Independent page navigation mapping
    const providerUrls = {
        'overview': "{% url 'portal_provider_overview' %}",
        'dispatches': "{% url 'portal_provider_dispatches' %}",
        'rfqs': "{% url 'portal_provider_rfqs' %}",
        'fleet': "{% url 'portal_provider_fleet' %}",
        'drivers': "{% url 'portal_provider_drivers' %}",
        'compliance': "{% url 'portal_provider_compliance' %}",
        'payouts': "{% url 'portal_provider_payouts' %}",
        'company': "{% url 'portal_provider_company' %}"
    };

    function switchTab(tabKey) {
        if (providerUrls[tabKey]) {
            window.location.href = providerUrls[tabKey];
        }
    }

    window.switchTab = switchTab;
    window.switchProviderTab = switchTab;

    // Modal helpers
    function openModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.classList.remove('hidden');
            if (window.lucide) window.lucide.createIcons();
        }
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        if (modal) modal.classList.add('hidden');
    }

    // Prefill and open quote modal
    function openQuoteModal(reqId, rfqNum, category, existingCost = '', existingVeh = '', existingNotes = '') {
        document.getElementById('modalQuoteReqId').value = reqId;
        document.getElementById('modalRfqSub').textContent = `RFQ #${rfqNum} • ${category}`;
        if (existingCost) document.getElementById('modalOfferedCost').value = existingCost;
        if (existingVeh) document.getElementById('modalVehicleSelect').value = existingVeh;
        if (existingNotes) document.getElementById('modalNotes').value = existingNotes;
        openModal('quoteModal');
    }

    // Prefill and open Edit Vehicle modal
    function openEditVehicleModal(btnOrId, make, model, year, category, seats, wifi, water, color, luggage, access, child) {
        if (typeof btnOrId === 'object' && btnOrId !== null && btnOrId.dataset) {
            const d = btnOrId.dataset;
            document.getElementById('editVehicleId').value = d.id || '';
            document.getElementById('editVehicleMake').value = d.make || '';
            document.getElementById('editVehicleYear').value = d.year || '';
            document.getElementById('editVehicleCategory').value = d.category || '';
            document.getElementById('editVehicleSeats').value = d.seats || '';
            document.getElementById('editVehicleColor').value = d.color || '';
            document.getElementById('editVehicleLuggage').value = d.luggage || '';
            document.getElementById('editVehicleWifi').checked = d.wifi === '1' || d.wifi === 'true';
            document.getElementById('editVehicleWater').checked = d.water === '1' || d.water === 'true';
            document.getElementById('editVehicleAccess').checked = d.access === '1' || d.access === 'true';
            document.getElementById('editVehicleChild').checked = d.child === '1' || d.child === 'true';
            // Show existing photo if available
            if (window._editVehicleShowExistingPhoto) {
                window._editVehicleShowExistingPhoto(d.photoUrl || '');
            }
        } else {
            document.getElementById('editVehicleId').value = btnOrId || '';
            document.getElementById('editVehicleMake').value = make || '';
            document.getElementById('editVehicleModel').value = model || '';
            document.getElementById('editVehicleYear').value = year || '';
            document.getElementById('editVehicleCategory').value = category || '';
            document.getElementById('editVehicleSeats').value = seats || '';
            document.getElementById('editVehicleColor').value = color || '';
            document.getElementById('editVehicleLuggage').value = luggage || '';
            document.getElementById('editVehicleWifi').checked = Boolean(wifi);
            document.getElementById('editVehicleWater').checked = Boolean(water);
            document.getElementById('editVehicleAccess').checked = Boolean(access);
            document.getElementById('editVehicleChild').checked = Boolean(child);
            if (window._editVehicleShowExistingPhoto) {
                window._editVehicleShowExistingPhoto('');
            }
        }
        openModal('editVehicleModal');
    }

    // Prefill and open Edit Driver modal
    function openEditDriverModal(btnOrId, name, phone, license, languages, expiry) {
        if (typeof btnOrId === 'object' && btnOrId !== null && btnOrId.dataset) {
            const d = btnOrId.dataset;
            document.getElementById('editDriverId').value = d.id || '';
            document.getElementById('editDriverName').value = d.name || '';
            document.getElementById('editDriverPhone').value = d.phone || '';
            document.getElementById('editDriverLicense').value = d.license || '';
            document.getElementById('editDriverLanguages').value = d.languages || '';
            document.getElementById('editDriverExpiry').value = d.expiry || '';
        } else {
            document.getElementById('editDriverId').value = btnOrId || '';
            document.getElementById('editDriverName').value = name || '';
            document.getElementById('editDriverPhone').value = phone || '';
            document.getElementById('editDriverLicense').value = license || '';
            document.getElementById('editDriverLanguages').value = languages || '';
            document.getElementById('editDriverExpiry').value = expiry || '';
        }
        openModal('editDriverModal');
    }

    // Filter RFQ cards
    function filterRfqs(filter) {
        document.querySelectorAll('.rfq-filter-btn').forEach(btn => {
            btn.classList.remove('bg-blue-600', 'text-white');
            btn.classList.add('bg-white/5', 'text-gray-400');
        });
        const activeBtn = document.getElementById(`rfq-filter-${filter}`);
        if (activeBtn) {
            activeBtn.classList.remove('bg-white/5', 'text-gray-400');
            activeBtn.classList.add('bg-blue-600', 'text-white');
        }

        document.querySelectorAll('.rfq-card').forEach(card => {
            if (filter === 'all') {
                card.classList.remove('hidden');
            } else if (filter === 'pending') {
                if (card.classList.contains('rfq-status-pending')) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            } else if (filter === 'quoted') {
                if (card.classList.contains('rfq-status-quoted')) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            }
        });
    }

    // --- SLIDE-OUT PANEL LOGIC ---
    function openViewVehiclePanel(btnOrRow) {
        const d = btnOrRow.dataset;
        if (!d || !d.id) return;
        
        // Populate Panel
        document.getElementById('panelVehiclePlate').textContent = (d.plate || '').toUpperCase();
        document.getElementById('panelVehicleName').textContent = d.vehicle || 'Unknown Vehicle';
        const yearColor = [];
        if (d.year) yearColor.push(d.year);
        if (d.color) yearColor.push(d.color);
        document.getElementById('panelVehicleYearColor').textContent = yearColor.join(' · ');
        
        document.getElementById('panelVehicleCategory').textContent = d.category || 'Standard';
        document.getElementById('panelVehicleSeats').textContent = d.seats || '0';
        document.getElementById('panelVehicleLuggage').textContent = d.luggage || 'N/A';
        
        // Status Badge
        const sb = document.getElementById('panelVehicleStatusBadge');
        sb.textContent = d.status || 'UNKNOWN';
        sb.className = 'px-3 py-1 text-[10px] font-black rounded-full shadow-lg backdrop-blur-md ' + 
            (d.status === 'AVAILABLE' ? 'bg-emerald-500/90 text-white' : 
            (d.status === 'ASSIGNED' ? 'bg-blue-500/90 text-white' : 
            (d.status === 'MAINTENANCE' ? 'bg-amber-500/90 text-white' : 'bg-slate-500/90 text-white')));
        
        // Compliance
        const cb = document.getElementById('panelVehicleCompliance');
        cb.innerHTML = '';
        if (d.compliance === 'COMPLIANT') {
            cb.className = 'text-sm font-semibold text-emerald-400 flex items-center gap-1.5';
            cb.innerHTML = '<i data-lucide="shield-check" class="w-4 h-4"></i> Compliant';
        } else if (d.compliance === 'NON_COMPLIANT') {
            cb.className = 'text-sm font-semibold text-red-400 flex items-center gap-1.5';
            cb.innerHTML = '<i data-lucide="shield-x" class="w-4 h-4"></i> Non-Compliant';
        } else {
            cb.className = 'text-sm font-semibold text-amber-400 flex items-center gap-1.5';
            cb.innerHTML = '<i data-lucide="clock" class="w-4 h-4"></i> Pending';
        }

        // Amenities
        const hasWifi = d.wifi === '1' || d.wifi === 'true';
        const hasWater = d.water === '1' || d.water === 'true';
        const hasAccess = d.access === '1' || d.access === 'true';
        const hasChild = d.child === '1' || d.child === 'true';
        
        document.getElementById('panelAmenityWifi').classList.toggle('hidden', !hasWifi);
        document.getElementById('panelAmenityWater').classList.toggle('hidden', !hasWater);
        document.getElementById('panelAmenityAccess').classList.toggle('hidden', !hasAccess);
        document.getElementById('panelAmenityChild').classList.toggle('hidden', !hasChild);
        document.getElementById('panelAmenityNone').classList.toggle('hidden', hasWifi || hasWater || hasAccess || hasChild);

        // Photo
        const photoEl = document.getElementById('panelVehiclePhoto');
        const placeholder = document.getElementById('panelVehiclePhotoPlaceholder');
        if (d.photoUrl) {
            photoEl.src = d.photoUrl;
            photoEl.classList.remove('hidden');
            placeholder.classList.add('hidden');
        } else {
            photoEl.src = '';
            photoEl.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }
        
        // Dynamic Link
        document.getElementById('panelVehicleDetailLink').href = `/provider/fleet/${d.id}/`;
        
        // Edit Button link
        const editBtn = document.getElementById('panelEditBtn');
        editBtn.onclick = () => {
            closeViewVehiclePanel();
            setTimeout(() => {
                const rowEditBtn = document.querySelector(`tr[data-id="${d.id}"] .edit-btn-trigger`);
                if (rowEditBtn) { rowEditBtn.click(); }
            }, 300);
        };

        if (window.lucide) window.lucide.createIcons();

        // Show panel
        document.getElementById('viewVehiclePanel').classList.remove('translate-x-full');
        document.getElementById('viewVehiclePanelBackdrop').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeViewVehiclePanel() {
        document.getElementById('viewVehiclePanel').classList.add('translate-x-full');
        document.getElementById('viewVehiclePanelBackdrop').classList.add('opacity-0', 'pointer-events-none');
    }

    // Escape key closes modals and panels
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('[id$="Modal"]').forEach(m => m.classList.add('hidden'));
            closeViewVehiclePanel();
        }
    });
</script>
